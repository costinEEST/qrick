<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRick</title>
    <style>
      html { color-scheme: light dark; }
      body {
        /* Desktop action popups derive their viewport from this definite width.
           Viewport-relative sizing here creates a circular size dependency. */
        width: 360px;
        min-width: 0;
        margin: 0;
        background: #fff;
      }
      @media (pointer: coarse) {
        body { width: min(360px, 100%); }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #191c22; }
      }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
