name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  skill-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check scripts/check_skills.py tests/test_skill_tooling.py
      - run: uv run --locked ruff format --check scripts/check_skills.py tests/test_skill_tooling.py
      - run: uv run --locked ty check
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --locked python scripts/check_skills.py
