[project]
name = "qrick-tooling"
version = "0.1.0"
description = "Development-only Python tools for QRick project skills"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pyyaml>=6.0.3,<7",
    "types-pyyaml>=6.0.12",
    "ruff>=0.16,<0.17",
    "ty==0.0.93",
]


[tool.uv]
package = false
required-version = ">=0.13.6,<0.14"

[tool.ruff]
target-version = "py315"
line-length = 88
include = ["scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["scripts/*.py", "tests/*.py"]
